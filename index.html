<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker | CodeCrafters Agency</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar" style="position: static;">
    <div class="nav-container">
      <a href="https://GIRIJA-alt-2705.github.io/Agency-Portfolio/" class="nav-logo">
        <div class="logo-icon"><span class="logo-bracket">&lt;</span>CC<span class="logo-bracket">/&gt;</span></div>
        <span class="logo-text">CodeCrafters</span>
      </a>
      <a href="https://GIRIJA-alt-2705.github.io/Agency-Portfolio/#projects" class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;">← Back to Portfolio</a>
    </div>
  </nav>

  <main class="expense-container">
    <div class="expense-header">
      <h1>Expense Tracker</h1>
      <p>Manage your income and expenses locally.</p>
    </div>

    <div class="dashboard">
      <!-- Balance Cards -->
      <div class="balance-cards">
        <div class="card balance-card">
          <h4>Total Balance</h4>
          <h2 id="balance">$0.00</h2>
        </div>
        <div class="card income-card">
          <h4>Income</h4>
          <h2 id="income" class="text-success">+$0.00</h2>
        </div>
        <div class="card expense-card">
          <h4>Expense</h4>
          <h2 id="expense" class="text-danger">-$0.00</h2>
        </div>
      </div>

      <div class="dashboard-grid">
        <!-- Add Transaction Form -->
        <div class="card form-container">
          <h3 id="form-title">Add Transaction</h3>
          <form id="transaction-form">
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
              <label for="desc">Description</label>
              <input type="text" id="desc" placeholder="e.g. Salary, Groceries" required autocomplete="off">
            </div>
            
            <div class="form-group">
              <label for="amount">Amount <small>(Negative for expense, positive for income)</small></label>
              <input type="number" id="amount" placeholder="e.g. -50 or 1500" step="0.01" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Add Transaction</button>
            <button type="button" class="btn btn-secondary btn-full" id="cancel-btn" style="display:none; margin-top:0.5rem;">Cancel Edit</button>
          </form>
        </div>

        <!-- Transactions List -->
        <div class="card list-container">
          <div class="list-header">
            <h3>Recent Transactions</h3>
            <div class="filter-controls">
              <select id="filter-type">
                <option value="all">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
          </div>
          
          <ul id="transaction-list" class="transaction-list">
            <!-- Rendered by JS -->
          </ul>
          
          <div id="empty-state" class="empty-state">
            <span class="empty-icon">📝</span>
            <p>No transactions found.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
